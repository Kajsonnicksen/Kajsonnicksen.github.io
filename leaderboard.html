<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080908">
<title>Rangliste · Min rutine</title>
<style>
:root{color-scheme:dark;--bg:#080908;--surface:#101210;--surface2:#171a17;--line:#292d29;--text:#f4f5f2;--muted:#929891;--green:#24bd70;--shadow:0 10px 30px #0002}
:root.light{color-scheme:light;--bg:#f4f5f1;--surface:#fff;--surface2:#eef0eb;--line:#dfe3dc;--text:#20251f;--muted:#747d73;--green:#159957;--shadow:0 8px 25px #23301a0d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;cursor:pointer}.page{width:min(100%,720px);margin:auto;padding:20px 16px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 22px}.top h1{font-size:26px;letter-spacing:-.8px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.back,.period button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.heading h2{font-size:19px;margin:0}.period{display:flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px}.period button{border:0;background:transparent;color:var(--muted);padding:7px 10px}.period button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:13px}.rank{color:var(--muted);font-weight:800}.name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.percent{font-size:21px;font-weight:800;color:var(--green)}.message{font-size:13px;line-height:1.5;color:var(--muted)}.message a{color:var(--green);font-weight:700}.foot{font-size:11px;line-height:1.5;color:var(--muted);margin:14px 2px}.loading{display:flex;gap:9px;align-items:center}.spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:380px){.page{padding:16px 12px 24px}.top h1{font-size:22px}.heading h2{font-size:17px}.back{padding:9px 11px}}
</style>
</head>
<body>
<main class="page">
 <header class="top"><div><h1>Jeres rangliste</h1><div class="sub">Sammenlign jeres rutiner</div></div><a class="back" href="./index.html">Tilbage til appen</a></header>
 <div class="heading"><h2>Gennemførelsesrate</h2><div class="period" aria-label="Vælg periode"><button id="period7" class="active" type="button">7 dage</button><button id="period30" type="button">30 dage</button></div></div>
 <section class="card" aria-live="polite"><div id="results" class="rows"><div class="message loading"><span class="spinner"></span>Henter ranglisten…</div></div></section>
 <p class="foot">Procenten beregnes ud fra gennemførte daglige vaner i perioden. Kun navn og procent deles; jeres vaner, kost og personlige mål forbliver private.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
document.documentElement.classList.toggle("light",localStorage.getItem("mr2-theme")==="light");
const config=window.MIN_RUTINE_SUPABASE||{},client=window.supabase?.createClient(config.url,config.publishableKey),root=document.querySelector("#results");let days=7;
function message(html){root.innerHTML="";const p=document.createElement("div");p.className="message";p.innerHTML=html;root.append(p)}
async function load(){document.querySelector("#period7").classList.toggle("active",days===7);document.querySelector("#period30").classList.toggle("active",days===30);root.innerHTML='<div class="message loading"><span class="spinner"></span>Henter ranglisten…</div>';
 try{
  if(!client)throw new Error("Supabase-klienten blev ikke indlæst.");
  const {data:{session},error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;
  if(!session){message('Log ind i appen først, og åbn derefter ranglisten igen. <a href="./index.html">Gå til login</a>');return}
  const {data:competitions,error}=await client.rpc("get_my_routine_competitions");if(error)throw error;
  if(!competitions?.length){message("Denne konto er ikke tilknyttet en konkurrence endnu. Kontrollér leaderboard-opsætningen i Supabase.");return}
  const {data:score,error:scoreError}=await client.rpc("get_routine_leaderboard",{p_competition_id:competitions[0].competition_id,p_days:days});if(scoreError)throw scoreError;
  root.innerHTML="";for(const [i,item] of (score||[]).entries()){const row=document.createElement("div");row.className="row";const rank=document.createElement("span");rank.className="rank";rank.textContent=String(i+1)+".";const name=document.createElement("span");name.className="name";name.textContent=item.display_name;const percent=document.createElement("span");percent.className="percent";percent.textContent=Number(item.completion_percent).toFixed(1)+"%";row.append(rank,name,percent);root.append(row)}
  if(!score?.length)message("Der er endnu ingen resultater for perioden. Registrér dagens vaner i appen først.");
 }catch(e){message("Ranglisten kunne ikke indlæses. Kontrollér at SQL-opsætningen for ranglisten er kørt i Supabase, og prøv igen.");console.error("Leaderboard load failed",e)}
}
document.querySelector("#period7").addEventListener("click",()=>{days=7;load()});document.querySelector("#period30").addEventListener("click",()=>{days=30;load()});load();
</script>
</body>
</html>
