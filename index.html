<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Min rutine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Min rutine</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#090909;--line:#292929;--muted:#999;--green:#19bd69;--white:#f5f5f5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
main{width:min(100%,760px);margin:auto;padding:24px 20px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 22px}
h1{font-size:clamp(27px,6vw,36px);letter-spacing:-1px;margin:0;font-weight:750}
.date{color:var(--muted);font-size:14px;margin-top:6px;text-transform:capitalize}
.counter{font-size:34px;font-weight:800;color:var(--green);white-space:nowrap;letter-spacing:-1px}
.progress{height:7px;background:#292929;border-radius:99px;overflow:hidden;margin:0 0 26px}
.fill{height:100%;background:var(--green);width:0%;border-radius:99px;transition:width .2s}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:#111;padding:5px;border-radius:14px}
.tab{border:0;background:transparent;color:#aaa;padding:12px 15px;border-radius:10px;font-size:15px;font-weight:650;flex:1}
.tab.active{background:#252525;color:#fff}
.section{margin:25px 0 0}
h2{font-size:23px;margin:0 0 10px;font-weight:750;letter-spacing:-.4px}
.item{display:flex;align-items:center;gap:14px;min-height:68px;border-bottom:1px solid #171717;padding:10px 2px;font-size:17px;line-height:1.35}
.item:last-child{border-bottom:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:27px;height:27px;border:2px solid #414141;border-radius:50%;flex:0 0 27px;margin:0;display:grid;place-items:center}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]:checked:after{content:"✓";font-size:17px;color:#06150c;font-weight:900}
.item.done .label{color:#777;text-decoration:line-through;text-decoration-color:#555}
.weekrow{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px;padding:17px 0;border-bottom:1px solid #242424;align-items:start}
.weekrow:last-child{border:0}
.day{font-weight:700}
.training{font-weight:600;line-height:1.4}
.goal{color:#aaa;line-height:1.4;font-size:14px}
.weekcheck{display:flex;align-items:center;gap:10px;margin-top:10px;color:#999;font-size:13px}
.weekcheck input{width:21px;height:21px;flex-basis:21px}
.footer{border-top:1px solid #222;margin-top:30px;padding-top:18px;color:#888;font-size:14px;line-height:1.5}
button.reset{width:100%;margin-top:22px;border:1.5px solid #414141;background:transparent;color:#aaa;border-radius:999px;padding:13px;font-size:15px;font-weight:650}
button.reset:active{background:#171717}
.smallnote{color:#777;font-size:12px;margin-top:10px}
@media(min-width:600px){main{padding:34px 32px 50px}.item{font-size:19px;min-height:74px}.weekrow{grid-template-columns:120px 1fr 1fr;font-size:18px}}
</style>
</head>
<body>
<main>
<header>
 <div><h1>Min rutine</h1><div class="date" id="today"></div></div>
 <div class="counter" id="counter">0/8</div>
</header>
<div class="progress"><div class="fill" id="dailyFill"></div></div>
<nav class="tabs">
 <button class="tab active" data-tab="daily">Daglig</button>
 <button class="tab" data-tab="weekly">Ugentlig</button>
</nav>
<section id="daily">
 <div id="dailyItems"></div>
 <button class="reset" id="resetDay">Nulstil dagens tjekliste</button>
 <div class="footer">Brug den som en støtte, ikke som endnu et præstationsmål.</div>
</section>
<section id="weekly" hidden>
 <div id="weekItems"></div>
 <div class="footer">Træningsplanen er en ramme. Tilpas belastningen efter søvn, energi og restitution.</div>
</section>
</main>
<script>
const daily = [
 ["Morgen",["15–20 minutters meditation","Ingen telefon de første 20 minutter"]],
 ["Dag",["20 minutters fokuseret læsning","Mindst én gåtur uden lyd i ørerne","Øv dig i at lytte uden at forberede svar"]],
 ["Aften",["15 minutters læsning","5 minutters refleksion","Undgå skærm lige inden sengetid"]]
];
const weekly = [
 ["Mandag","Styrke, helkrop","Muskel- og nervesystem"],
 ["Tirsdag","Roligt løb, 40 min.","Aerob base"],
 ["Onsdag","Hvile + gåtur","Restitution"],
 ["Torsdag","Styrke, helkrop","Fysisk robusthed"],
 ["Fredag","Interval, 30–40 min.","Kondition"],
 ["Lørdag","Roligt langløb, 50–70 min.","Udholdenhed"],
 ["Søndag","Hvile + let yoga","Restitution"]
];
const $=s=>document.querySelector(s);
const dateKey=()=>new Date().toLocaleDateString("sv-SE");
function mondayKey(){let d=new Date();d.setHours(12,0,0,0);let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toLocaleDateString("sv-SE")}
const dayStore=()=>JSON.parse(localStorage.getItem("routine-day")||"{}");
const weekStore=()=>JSON.parse(localStorage.getItem("routine-week")||"{}");
function renderDaily(){
 const state=dayStore(), key=dateKey(), root=$("#dailyItems");root.innerHTML="";
 let n=0,total=0;
 daily.forEach(([section,items])=>{
  const block=document.createElement("div");block.className="section";
  const h=document.createElement("h2");h.textContent=section;block.append(h);
  items.forEach(label=>{
   total++;const id=section+"|"+label, checked=state.date===key&&!!state.done?.[id];if(checked)n++;
   const row=document.createElement("label");row.className="item"+(checked?" done":"");
   const cb=document.createElement("input");cb.type="checkbox";cb.checked=checked;
   cb.addEventListener("change",()=>{let s=dayStore();if(s.date!==key)s={date:key,done:{}};s.done=s.done||{};s.done[id]=cb.checked;localStorage.setItem("routine-day",JSON.stringify(s));renderDaily()});
   const span=document.createElement("span");span.className="label";span.textContent=label;row.append(cb,span);block.append(row);
  });root.append(block);
 });
 $("#counter").textContent=n+"/"+total;$("#dailyFill").style.width=(n/total*100)+"%";
}
function renderWeekly(){
 const state=weekStore(),wk=mondayKey(),root=$("#weekItems");root.innerHTML="";
 weekly.forEach(([day,training,goal],i)=>{
  const row=document.createElement("div");row.className="weekrow";
  const d=document.createElement("div");d.className="day";d.textContent=day;
  const t=document.createElement("div");t.innerHTML='<div class="training"></div><label class="weekcheck"><input type="checkbox"><span>Gennemført</span></label>';t.querySelector(".training").textContent=training;
  const g=document.createElement("div");g.className="goal";g.textContent=goal;
  const cb=t.querySelector("input");cb.checked=state.week===wk&&!!state.done?.[i];
  cb.addEventListener("change",()=>{let s=weekStore();if(s.week!==wk)s={week:wk,done:{}};s.done=s.done||{};s.done[i]=cb.checked;localStorage.setItem("routine-week",JSON.stringify(s));});
  row.append(d,t,g);root.append(row);
 });
}
document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
 $("#daily").hidden=btn.dataset.tab!=="daily";$("#weekly").hidden=btn.dataset.tab!=="weekly";
}));
$("#resetDay").addEventListener("click",()=>{localStorage.setItem("routine-day",JSON.stringify({date:dateKey(),done:{}}));renderDaily()});
$("#today").textContent=new Intl.DateTimeFormat("da-DK",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
renderDaily();renderWeekly();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
